<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SqliteWasmBlazor.Demo</title>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="_content/SqliteWasmBlazor.FloatingWindow/floating-window.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" crossorigin="anonymous" />
    <!-- favicon.svg is the mark drawn for 16-32px; the PNG is its fallback
         for browsers that take only raster favicons. Both come from the SVG
         sources checked in beside them. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <!-- Installed-web-app metadata. Every href is relative so it resolves
         against <base href>, which ReleaseSubfolder rewrites for subfolder
         deployments. display:standalone is what makes this an installed web
         app rather than a bookmark, and so also what makes a finished export
         arrive on an OS intermediate screen instead of in a downloads folder
         — which the export card explains. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#03173d" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js" crossorigin="anonymous"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js" crossorigin="anonymous"></script>
    <!-- Registers the service worker and wires the update-notification flow,
         in every configuration. The development worker (service-worker.js)
         caches nothing, so the iteration loop is untouched; it is registered
         anyway because query cancellation needs a service worker to carry the
         cancel to the SQLite worker. A worker controls the page that registered
         it from the next load on, so a fresh profile has cancellation from its
         second load. Registration is non-inline to satisfy the CSP script-src
         directive. -->
    <script src="service-worker-update.js"></script>
</body>

</html>
